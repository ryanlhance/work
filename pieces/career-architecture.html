<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryan Hance's Career Knowledge Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN SYSTEM
   Type: Geist throughout. Headings 600, labels 500, body 400.
         Sizes: 28 / 17 / 15 / 14 / 12.5. Nothing else.
   One card: 200 x 56, radius 12. One faded pill: 200 x 28, radius 8.
   One rule row: 200 x 34, radius 8. Frames radius 16, lanes radius 20.
   States: rest (paper), lit (ink), picked (ink + gold ring), faded (pill).
   Color: section hue appears only in icons and header underlines.
   ============================================================ */
:root {
  --paper: #f3efe4;
  --paper-2: #ebe6d8;
  --card: #fbf9f3;
  --ink: #151920;
  --ink-soft: #3b4049;
  --dim: #75736d;
  --line: rgba(21, 25, 32, 0.13);
  --gold: #c99a45;

  --c-inputs: #66784c;   --l-inputs: #c3d1a6;   --d-inputs: #34422a;
  --c-context: #a4772b;  --l-context: #ecc678;  --d-context: #5c3f10;
  --c-gates: #3b6d69;    --l-gates: #9ccdc6;    --d-gates: #173f3c;
  --c-rules: #7c6150;    --l-rules: #ddbea4;    --d-rules: #47352a;
  --c-outputs: #46607c;  --l-outputs: #b1c6de;  --d-outputs: #1f3248;

  --display: "Geist", "Helvetica Neue", Arial, sans-serif;
  --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --t-move: .9s;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: radial-gradient(1400px 800px at 38% 42%, #f8f5ed 0%, var(--paper) 55%, var(--paper-2) 100%);
  color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden;
}
#viewport { position: fixed; inset: 0; overflow: hidden; }
body.narrow #viewport { overflow: auto; -webkit-overflow-scrolling: touch; }
body.scrolly #viewport { overflow-x: hidden; overflow-y: auto; }
#sizer { position: relative; width: 100%; height: 100%; }
#stage { position: absolute; left: 0; top: 0; width: 1440px; height: 1124px; transform-origin: 0 0; }

/* ---------- header ---------- */
.masthead { position: absolute; left: 58px; top: 48px; max-width: 1000px; }
.masthead h1 { font: 600 30px/1.15 var(--display); letter-spacing: -0.025em; }
.masthead .cta {
  margin-top: 14px; display: inline-flex; align-items: center; gap: 10px;
  background: none; border: 0; padding: 0; cursor: pointer;
  font: 500 15px/1 var(--sans); color: var(--ink);
}
.masthead .cta .play {
  width: 24px; height: 24px; border-radius: 50%; background: var(--ink);
  display: grid; place-items: center; transition: transform .2s var(--ease), background-color .2s;
}
.masthead .cta .play svg { width: 10px; height: 10px; fill: #f5f1e6; margin-left: 2px; }
.masthead .cta:hover .play, .masthead .cta:focus-visible .play { transform: scale(1.08); background: var(--gold); }
.masthead .cta:hover span, .masthead .cta:focus-visible span { text-decoration: underline; text-underline-offset: 3px; }
.masthead p { margin-top: 10px; font: 400 15px/1.5 var(--sans); color: var(--dim); }

#reset {
  position: fixed; left: 0; top: 0; z-index: 30;
  font: 500 14px/1 var(--sans); color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  padding: 11px 18px; cursor: pointer;
  opacity: 0; pointer-events: none; transform: translateY(-4px);
  transition: opacity .35s var(--ease), transform .35s var(--ease), border-color .2s;
}
#reset.show { opacity: 1; pointer-events: auto; transform: none; }
#reset:hover { border-color: rgba(21, 25, 32, 0.4); }

/* ---------- columns ---------- */
.lane { position: absolute; top: 196px; bottom: 104px; border-radius: 20px; background: color-mix(in srgb, var(--sec) 7%, transparent); }
.colhead {
  position: absolute; top: 220px; display: flex; align-items: center; gap: 8px;
  font: 600 18px/1 var(--display); letter-spacing: -0.015em; cursor: help; padding-bottom: 10px;
}
.colhead svg { width: 15px; height: 15px; fill: none; stroke: var(--dim); stroke-width: 1.8; stroke-linecap: round; }

/* ---------- cards ---------- */
.node {
  position: absolute; left: 0; top: 0;
  display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 10px;
  padding: 0 12px 0 10px;
  background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 1px 2px rgba(21, 25, 32, 0.04);
  font: 500 14px/1.2 var(--sans); text-align: left;
  cursor: pointer; outline: none; overflow: hidden;
  transition:
    transform var(--t-move) var(--ease), width var(--t-move) var(--ease), height var(--t-move) var(--ease),
    opacity .4s var(--ease), background-color .4s var(--ease), color .4s var(--ease),
    border-color .3s var(--ease), box-shadow .4s var(--ease), border-radius .4s var(--ease);
  will-change: transform;
}
.node:hover, .node:focus-visible { border-color: rgba(21, 25, 32, 0.4); }
.node .chip {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: color-mix(in srgb, var(--sec) 13%, transparent);
  transition: all .4s var(--ease);
}
.node svg { width: 17px; height: 17px; fill: none; stroke: var(--sec); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; transition: stroke .4s var(--ease), width .4s, height .4s; }
.node .label { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* Rule row: the small version of a card, used inside output frames */
.node.rule { font-size: 12.5px; line-height: 1.1; border-radius: 8px; grid-template-columns: 16px 1fr; gap: 8px; padding: 0 10px; }
.node.rule .chip { width: 16px; height: 16px; background: none; }
.node.rule svg { width: 14px; height: 14px; }
.node.rule .label { -webkit-line-clamp: 2; }
.node.hidden { opacity: 0; pointer-events: none; }

/* Faded pill: the same in every column */
.node.pill {
  font-size: 12.5px; border-radius: 8px; grid-template-columns: 16px 1fr; gap: 8px; padding: 0 10px;
  color: rgba(21, 25, 32, 0.38); background: rgba(246, 243, 235, 0.96); border-color: rgba(21, 25, 32, 0.07); box-shadow: none;
}
.node.pill .chip { width: 16px; height: 16px; background: none; }
.node.pill svg { width: 13px; height: 13px; stroke: rgba(21, 25, 32, 0.3); }
.node.pill .label { display: block; white-space: nowrap; text-overflow: ellipsis; }
.node.pill:hover { color: rgba(21, 25, 32, 0.7); border-color: rgba(21, 25, 32, 0.2); }

.node.on {
  /* --t is this card's share of influence on (or from) the selected card: 1 = the section's deepest tone */
  background: color-mix(in srgb, var(--deep) calc(var(--t, 1) * 100%), var(--card));
  border-color: color-mix(in srgb, var(--deep) calc(40% + var(--t, 1) * 60%), transparent);
  color: #f7f3ea; box-shadow: 0 8px 20px rgba(21, 25, 32, calc(var(--t, 1) * 0.18));
}
.node.on.picked { background: var(--ink); border-color: var(--ink); }
.node.on.soft { color: var(--ink); }
.node.on.soft svg { stroke: var(--sec); }
.node.on.soft .chip { background: color-mix(in srgb, var(--sec) 13%, transparent); }
.node.on .chip { background: rgba(255, 255, 255, 0.08); }
.node.rule.on .chip { background: none; }
.node.on svg { stroke: var(--lit); }
.node.picked { box-shadow: 0 0 0 2.5px var(--gold), 0 10px 24px rgba(21, 25, 32, 0.24); }

.s-inputs  { --sec: var(--c-inputs);  --lit: var(--l-inputs);  --deep: var(--d-inputs); }
.s-context { --sec: var(--c-context); --lit: var(--l-context); --deep: var(--d-context); }
.s-gates   { --sec: var(--c-gates);   --lit: var(--l-gates);   --deep: var(--d-gates); }
.s-rules   { --sec: var(--c-rules);   --lit: var(--l-rules);   --deep: var(--d-rules); }
.s-outputs { --sec: var(--c-outputs); --lit: var(--l-outputs); --deep: var(--d-outputs); }

/* ---------- output frames (hold the rules) ---------- */
.frame {
  position: absolute; left: 0; top: 0; border-radius: 16px;
  border: 1px solid rgba(21, 25, 32, 0.1); background: rgba(255, 255, 255, 0.32);
  transition: transform var(--t-move) var(--ease), width var(--t-move) var(--ease), height var(--t-move) var(--ease), opacity .4s var(--ease);
}
.frame.gone { opacity: 0; }
.frame .foot {
  position: absolute; left: 12px; right: 12px; bottom: 9px; height: 18px;
  display: flex; align-items: center; gap: 7px;
  font: 500 12.5px/1 var(--sans); color: var(--c-rules); cursor: pointer;
  transition: opacity .3s var(--ease);
}
.frame .foot svg { width: 14px; height: 14px; fill: none; stroke: var(--c-rules); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.frame .foot:hover { color: var(--ink); }
.frame.picked { box-shadow: 0 0 0 2.5px var(--gold); background: rgba(255, 255, 255, 0.6); }
.frame.picked .foot { color: var(--ink); }

/* ---------- bracket under Inputs to Gates ---------- */
.bracket { position: absolute; top: 1036px; height: 12px; border: 1.5px solid rgba(21, 25, 32, 0.35); border-top: none; border-radius: 0 0 6px 6px; }
.bracket span { position: absolute; left: 0; right: 0; top: 20px; text-align: center; font: 500 13px/1 var(--display); letter-spacing: 0; color: var(--dim); }

/* ---------- arrows ---------- */
#wires { position: absolute; left: 0; top: 0; width: 1440px; height: 1124px; overflow: visible; pointer-events: none; }
#wires path { fill: none; stroke: rgba(21, 25, 32, 0.4); stroke-width: 1.4; }
#wires path.hot { stroke: var(--gold); stroke-width: 2.1; }
#wires polygon { fill: rgba(21, 25, 32, 0.55); opacity: 0; transition: opacity .2s var(--ease); }
#wires polygon.hot { fill: var(--gold); }
#wires polygon.show { opacity: 1; }
#wires g.fading { opacity: 0; transition: opacity .3s var(--ease); }

/* ---------- explainer ---------- */
#tip {
  position: fixed; z-index: 40; width: 300px; pointer-events: none;
  background: #fffdf8; border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 18px 44px rgba(21, 25, 32, 0.16); padding: 16px 18px;
  opacity: 0; transform: translateY(4px); transition: opacity .18s var(--ease), transform .18s var(--ease);
}
#tip.show { opacity: 1; transform: none; }
#tip.sheet { left: 12px !important; right: 12px; top: auto !important; bottom: 12px; width: auto; }
#tip .over { font: 500 12.5px/1 var(--sans); color: var(--sec); }
#tip h3 { margin-top: 8px; font: 600 17px/1.25 var(--display); letter-spacing: -0.01em; }
#tip p { margin-top: 8px; font: 400 14px/1.5 var(--sans); color: var(--ink-soft); }
#tip ul { margin-top: 10px; padding-left: 16px; font: 400 14px/1.45 var(--sans); color: var(--ink-soft); }
#tip li + li { margin-top: 4px; }
#tip .lives { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font: 400 12.5px/1.3 var(--sans); color: var(--dim); }
#tip .lives b { font-weight: 500; color: var(--ink-soft); }

#fade { position: fixed; top: 0; right: 0; bottom: 0; width: 48px; pointer-events: none; z-index: 20;
  background: linear-gradient(to right, rgba(243, 239, 228, 0), rgba(235, 230, 216, 0.95)); opacity: 0; transition: opacity .3s; }
body.narrow #fade.show { opacity: 1; }

body:not(.ready) .node, body:not(.ready) .frame { transition: none; }
@media (prefers-reduced-motion: reduce) { :root { --t-move: .01s; } #tip, #reset { transition-duration: .01s; } }
</style>
</head>

<div id="viewport"><div id="sizer">
  <div id="stage">
    <div class="masthead"><h1></h1><p></p><button class="cta" type="button"><span class="play"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0.6 L9 5 L1 9.4 Z"/></svg></span><span></span></button></div>
    <svg id="wires" viewBox="0 0 1440 1124"></svg>
  </div>
</div></div>
<button id="reset" type="button"></button>
<div id="fade"></div>
<div id="tip" role="tooltip"></div>

    });
    foot.addEventListener("mouseenter", () => hoverTip(foot, t()));
    foot.addEventListener("mouseleave", () => { if (!touching) hideTip(); });
    foot.addEventListener("click", ev => {
      ev.stopPropagation();
      const again = current === "g:" + f.name;
      muteHover(ev);
      hideTip();
      select("g:" + f.name);
      if (ev.pointerType !== "mouse" && !again) later(() => showTip(foot, t()), REDUCED ? 0 : 700);
    });
    stage.insertBefore(d, wires);
    frameEls[f.name] = d;
  });

  let touching = false;
  addEventListener("pointerdown", e => { touching = e.pointerType === "touch"; }, true);

  const els = {};
  DATA.items.forEach(it => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "node s-" + it.column + (isRule(it.id) ? " rule hidden" : "");
    b.innerHTML = `<span class="chip"><svg viewBox="0 0 24 24" aria-hidden="true">${DATA.icons[it.type]}</svg></span><span class="label"></span>`;
    b.querySelector(".label").textContent = it.label;
    b.setAttribute("aria-label", it.label);
    b.addEventListener("mouseenter", () => hoverTip(b, tipFor(it)));
    b.addEventListener("mouseleave", () => { if (!touching) hideTip(); });
    b.addEventListener("focus", () => { if (!clickedRecently) showTip(b, tipFor(it)); });
    b.addEventListener("blur", hideTip);
    b.addEventListener("click", ev => {
      ev.stopPropagation();
      const again = current === it.id;
      muteHover(ev);
      hideTip();
      select(it.id);
      // Touch and keyboard have no hover: show the explainer once the card settles.
      if (ev.pointerType !== "mouse" && !again) later(() => showTip(b, tipFor(it)), REDUCED ? 0 : 700);
    });
    stage.appendChild(b);
    els[it.id] = b;
  });

  // ---------- layout ----------
  const pos = {};        // id -> {x, y, w, h, pill, hidden}
  const fpos = {};       // frame name -> {x, y, w, h, open, gone}
  const place = (id, x, y, o = {}) => { pos[id] = { x, y, w: o.w || CW, h: o.h || CH, pill: !!o.pill, hidden: !!o.hidden }; };
  const mid = id => pos[id].y + pos[id].h / 2;
  const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : MID;
  const inCol = slot => DATA.items.filter(it => it.slot === slot);

  function clustersOf(list) {
    const cs = [];
    list.forEach(it => {
      let c = cs.find(c => c.name === it.group);
      if (!c) cs.push(c = { name: it.group, items: [] });
      c.items.push(it);
    });
    return cs;
  }
  // Two across only when both cards feed the same place.
  const acrossFor = c => {
    const t = c.items.map(it => outs[it.id].slice().sort().join());
    return t.every(x => x === t[0]) ? 2 : 1;
  };

  function restLayout() {
    // Inputs
    const cs = clustersOf(inCol("inputs")), step = CH + 10, cGap = 18;
    const rows = cs.reduce((n, c) => n + Math.ceil(c.items.length / acrossFor(c)), 0);
    let y = MID - (rows * step - 10 + (cs.length - 1) * cGap) / 2;
    cs.forEach(c => {
      const n = acrossFor(c);
      c.items.forEach((it, i) => place(it.id, X.inputs + (i % n) * (CW + GAP_IN), y + Math.floor(i / n) * step));
      y += Math.ceil(c.items.length / n) * step + cGap;
    });
    // Context sits beside what feeds it
    inCol("context").forEach(it => place(it.id, X.context, avg(ins[it.id].map(mid)) - CH / 2));
    // Gates spread evenly, ordered to limit crossings
    const gates = inCol("gates").map(it => ({ it, w: avg(ins[it.id].map(mid)) })).sort((a, b) => a.w - b.w);
    spreadEven(gates.map(g => g.it.id), X.gates, 94);
    // Outputs: frames and single cards
    stackUnits(outputUnits(null), MID);
  }

  function spreadEven(ids, x, maxStep) {
    const step = Math.min(maxStep, (BOTTOM - TOP) / ids.length);
    const y0 = MID - ((ids.length - 1) * step + CH) / 2;
    ids.forEach((id, i) => place(id, x, y0 + i * step));
  }

  // A unit is one output card, or a frame holding outputs (and, when open, their rules).
  function outputUnits(lit, sizes) {
    const s = sizes || SIZES[0];
    const units = [], used = new Set();
    inCol("outputs").forEach(it => {
      if (used.has(it.id)) return;
      if (lit && !lit.has(it.id)) return;
      const f = frameOf(it.id);
      if (f) {
        const members = f.members.filter(m => !lit || lit.has(m));
        members.forEach(m => used.add(m));
        const shown = [];   // rules stay wrapped; the footer carries them
        const body = members.length * s.ch + (members.length - 1) * 8;
        const h = s.pad + body + (shown.length ? s.pad - 2 + shown.length * s.rowStep - (s.rowStep - s.row) : FOOT) + s.pad;
        units.push({ frame: f, members, shown, h, s, weight: avg(members.flatMap(m => ins[m].filter(g => byId[g].column === "gates").map(mid))) });
      } else {
        used.add(it.id);
        units.push({ id: it.id, h: s.ch, s, weight: avg(ins[it.id].filter(g => byId[g].column === "gates").map(mid)) });
      }
    });
    return units;
  }

  // Three spacing tiers; the tightest that isn't needed is never used.
  const SIZES = [
    { ch: CH, row: ROW, rowStep: ROW_STEP, pad: FPAD, gap: 18 },
    { ch: 46, row: 30, rowStep: 33, pad: FPAD, gap: 16 },
    { ch: 46, row: 30, rowStep: 32, pad: 8, gap: 12 },
    { ch: 40, row: 28, rowStep: 30, pad: 8, gap: 12 },
  ];
  const unitsHeight = us => us.reduce((t, u) => t + u.h, 0) + (us.length - 1) * (us[0] ? us[0].s.gap : 0);
  function stackUnits(units, centerY, top) {
    const gap = units[0] ? units[0].s.gap : 18;
    const total = unitsHeight(units);
    if (top == null) top = centerY - total / 2;
    let y = top;
    frames.forEach(f => {
      if (!units.some(u => u.frame === f)) fpos[f.name] = { ...(fpos[f.name] || { x: X.outputs - FPAD, y: MID, w: CW + FPAD * 2, h: 40 }), gone: true, open: false };
      f.rules.forEach(r => { if (!pos[r] || !units.some(u => u.frame === f && u.shown.includes(r))) place(r, X.outputs, (fpos[f.name] ? fpos[f.name].y : MID) + 20, { h: ROW, hidden: true }); });
    });
    units.forEach(u => {
      if (u.frame) {
        let yy = y + u.s.pad;
        u.members.forEach(m => { place(m, X.outputs, yy, { h: u.s.ch }); yy += u.s.ch + 8; });
        if (u.shown.length) yy += u.s.pad - 2 - 8;
        u.shown.forEach(r => { place(r, X.outputs, yy, { h: u.s.row }); yy += u.s.rowStep; });
        fpos[u.frame.name] = { x: X.outputs - FPAD, y, w: CW + FPAD * 2, h: u.h, open: u.shown.length > 0, gone: false };
      } else {
        place(u.id, X.outputs, y, { h: u.s.ch });
      }
      y += u.h + gap;
    });
    return { top, bottom: top + total };
  }

  // Faded cards become pills stacked above and below what's lit.
  function stackPills(list, x0, across, top, bottom, restOrder) {
    if (!list.length) return;
    const litMid = restOrder.mid;
    const above = list.filter(it => restOrder.rank(it) < litMid);
    const below = list.filter(it => restOrder.rank(it) >= litMid);
    const put = (arr, dir) => {
      const rows = Math.ceil(arr.length / across);
      arr.forEach((it, i) => {
        const row = Math.floor(i / across), col = i % across;
        const x = x0 + col * (CW + GAP_IN);
        const y = dir < 0 ? top - 24 - PILL - (rows - 1 - row) * PILL_STEP : bottom + 24 + row * PILL_STEP;
        place(it.id, x, y, { h: PILL, pill: true });
      });
    };
    put(above, -1);
    put(below, 1);
  }
  // Lay a column out as one stack: pills above, the lit block, pills below, always inside the column.
  function layColumn(off, across, x0, blockH, placeBlock, oi) {
    const above = off.filter(it => oi.rank(it) < oi.mid), below = off.filter(it => oi.rank(it) >= oi.mid);
    const hOf = n => n ? Math.ceil(n / across) * PILL_STEP - (PILL_STEP - PILL) + 24 : 0;
    const total = hOf(above.length) + blockH + hOf(below.length);
    const top = Math.max(TOP, Math.min(MID - total / 2, BOTTOM - total));
    const put = (arr, y0) => arr.forEach((it, i) => place(it.id, x0 + (i % across) * (CW + GAP_IN), y0 + Math.floor(i / across) * PILL_STEP, { h: PILL, pill: true }));
    put(above, top);
    const blockTop = top + hOf(above.length);
    placeBlock(blockTop);
    put(below, blockTop + blockH + 24);
  }
  function pillsFromTop(list, x0, across) {
    list.forEach((it, i) => place(it.id, x0 + (i % across) * (CW + GAP_IN), TOP + Math.floor(i / across) * PILL_STEP, { h: PILL, pill: true }));
  }

  function traceLayout(lit) {
    restLayout();
    const rest = {};
    Object.keys(pos).forEach(k => rest[k] = { ...pos[k] });
    const rankOf = it => rest[it.id].y * 10 + rest[it.id].x / 1000;
    const orderInfo = on => ({ mid: avg(on.map(rankOf)), rank: rankOf });

    // Inputs: one column when it fits; otherwise a brick layout so every arrow has a clear lane.
    {
      const all = inCol("inputs").slice().sort((a, b) => rankOf(a) - rankOf(b));
      const on = all.filter(it => lit.has(it.id)), off = all.filter(it => !lit.has(it.id));
      if (!on.length) pillsFromTop(off, X.inputs, 2);
      else if (on.length <= 8) {
        const step = CH + 10;
        layColumn(off, 2, X.inputs, on.length * step - 10,
          top => on.forEach((it, i) => place(it.id, X.inputs + (INPUT_W - CW) / 2, top + i * step)), orderInfo(on));
      } else {
        const step = CH + 8, half = step / 2, rows = Math.ceil(on.length / 2);
        layColumn(off, 2, X.inputs, rows * step - 8 + half, top => on.forEach((it, i) => {
          const col = i % 2, row = Math.floor(i / 2);
          place(it.id, X.inputs + col * (CW + GAP_IN), top + row * step + col * half);
        }), orderInfo(on));
      }
    }

    // Context and gates: lit cards centered, the rest as pills
    ["context", "gates"].forEach(slot => {
      const all = inCol(slot).slice().sort((a, b) => rankOf(a) - rankOf(b));
      const on = all.filter(it => lit.has(it.id)), off = all.filter(it => !lit.has(it.id));
      if (!on.length) { pillsFromTop(off, X[slot], 1); return; }
      const step = CH + 12;
      layColumn(off, 1, X[slot], on.length * step - 12, top => on.forEach((it, i) => place(it.id, X[slot], top + i * step)), orderInfo(on));
    });

    // Outputs: lit frames and cards centered, faded outputs as pills
    {
      const all = inCol("outputs").slice().sort((a, b) => rankOf(a) - rankOf(b));
      const on = all.filter(it => lit.has(it.id)), off = all.filter(it => !lit.has(it.id));
      if (!on.length) {
        frames.forEach(f => { fpos[f.name] = { ...fpos[f.name], gone: true, open: false }; f.rules.forEach(r => place(r, X.outputs, fpos[f.name].y + 20, { h: ROW, hidden: true })); });
        pillsFromTop(off, X.outputs, 1);
      } else {
        const order = u => avg((u.members || [u.id]).map(m => rankOf(byId[m])));
        const oi = orderInfo(on);
        const above = off.filter(it => oi.rank(it) < oi.mid), below = off.filter(it => oi.rank(it) >= oi.mid);
        let pg = 24;
        const pillsH = n => n ? n * PILL_STEP - (PILL_STEP - PILL) + pg : 0;
        const need = us => pillsH(above.length) + unitsHeight(us) + pillsH(below.length);
        let units;
        for (const sz of SIZES) {
          units = outputUnits(lit, sz).sort((a, b) => order(a) - order(b));
          if (need(units) <= BOTTOM - TOP) break;
        }
        if (need(units) > BOTTOM - TOP) pg = 10;
        const total = need(units);
        let y = Math.max(TOP, Math.min(MID - total / 2, BOTTOM - total));
        above.forEach(it => { place(it.id, X.outputs, y, { h: PILL, pill: true }); y += PILL_STEP; });
        if (above.length) y += pg - (PILL_STEP - PILL);
        const span = stackUnits(units, 0, y);
        y = span.bottom + (below.length ? pg : 0);
        below.forEach(it => { place(it.id, X.outputs, y, { h: PILL, pill: true }); y += PILL_STEP; });
      }
    }

  }

  function render() {
    DATA.items.forEach(it => {
      const p = pos[it.id], e = els[it.id];
      e.style.transform = `translate(${p.x}px, ${p.y}px)`;
      e.style.width = p.w + "px";
      e.style.height = p.h + "px";
      e.classList.toggle("pill", p.pill);
      e.classList.toggle("hidden", p.hidden);
    });
    frames.forEach(f => {
      const p = fpos[f.name], e = frameEls[f.name];
      e.style.transform = `translate(${p.x}px, ${p.y}px)`;
      e.style.width = p.w + "px";
      e.style.height = p.h + "px";
      e.classList.toggle("gone", !!p.gone);
      e.classList.toggle("open", !!p.open);
    });
  }

  // ---------- arrows ----------
  // Everything visible in a column, so arrows that skip a column can go around it.
  function obstacles(slot) {
    const list = inCol(slot).filter(it => !pos[it.id].hidden).map(it => [pos[it.id].y, pos[it.id].y + pos[it.id].h]);
    if (slot === "outputs") frames.forEach(f => { const p = fpos[f.name]; if (!p.gone) list.push([p.y, p.y + p.h]); });
    return list;
  }
  function clearY(slot, y) {
    const obs = obstacles(slot), m = 5;
    const blocked = v => obs.some(([a, b]) => v > a - m && v < b + m);
    if (!blocked(y)) return y;
    const cands = obs.flatMap(([a, b]) => [a - m - 2, b + m + 2]).filter(v => !blocked(v) && v > TOP - 40 && v < BOTTOM + 10);
    return cands.sort((a, b) => Math.abs(a - y) - Math.abs(b - y))[0] ?? y;
  }

  // Arrow weight follows influence: thickness and strength scale with the share that flows along it.
  const strokeFor = f => 0.8 + 4.6 * Math.pow(f, 0.75);
  function drawEdge(layer, a, b, hot, f) {
    const A = pos[a], B = pos[b];
    if (byId[a].slot === byId[b].slot) return drawLoop(layer, A, B, hot, f);
    const sw = strokeFor(f), L = 5 + sw * 1.1, hh = 2.6 + sw * 0.75;
    const x1 = A.x + A.w, y1 = A.y + A.h / 2, x2 = B.x - L, y2 = B.y + B.h / 2;
    const pts = [[x1, y1]];
    // A left-column input in the brick layout runs straight through the gap first.
    if (byId[a].slot === "inputs" && A.x < X.inputs + 10 && inCol("inputs").some(it => !pos[it.id].pill && pos[it.id].x > X.inputs + CW)) {
      pts.push([X.inputs + INPUT_W + 6, y1]);
    }
    const from = SLOTS.indexOf(byId[a].slot), to = SLOTS.indexOf(byId[b].slot);
    for (let k = from + 1; k < to; k++) {
      const slot = SLOTS[k], left = X[slot] - 14, right = X[slot] + CW + 14;
      const [px, py] = pts[pts.length - 1];
      const y = clearY(slot, py + (y2 - py) * ((left - px) / (x2 - px)));
      pts.push([left, y], [right, y]);
    }
    pts.push([x2, y2]);
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {
      const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
      if (ay === by) { d += ` L${bx},${by}`; continue; }
      const dx = Math.max(12, (bx - ax) * 0.5);
      d += ` C${ax + dx},${ay} ${bx - dx},${by} ${bx},${by}`;
    }
    animate(layer, d, `${x2 + L},${y2} ${x2},${y2 - hh} ${x2},${y2 + hh}`, hot, f);
  }

  // Output to Leave Behinds, same column: loop out the right side and come back in.
  function drawLoop(layer, A, B, hot, f) {
    const sw = strokeFor(f), L = 5 + sw * 1.1, hh = 2.6 + sw * 0.75;
    const x1 = A.x + A.w, y1 = A.y + A.h / 2, xe = B.x + B.w + L, y2 = B.y + B.h / 2;
    const o = 24 + Math.min(30, Math.abs(y2 - y1) * 0.06);
    const d = `M${x1},${y1} C${x1 + o},${y1} ${xe + o},${y2} ${xe},${y2}`;
    animate(layer, d, `${xe - L},${y2} ${xe},${y2 - hh} ${xe},${y2 + hh}`, hot, f);
  }

  function animate(layer, d, headPts, hot, f) {
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("d", d);
    const head = document.createElementNS(SVGNS, "polygon");
    head.setAttribute("points", headPts);
    if (hot) { path.classList.add("hot"); head.classList.add("hot"); }
    const strength = Math.min(0.95, 0.14 + 0.8 * Math.pow(f, 0.75));
    path.style.strokeWidth = strokeFor(f);
    path.style.strokeOpacity = hot ? Math.max(0.55, strength) : strength;
    head.style.fillOpacity = hot ? Math.max(0.6, strength) : strength;
    layer.appendChild(path);
    layer.appendChild(head);
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.getBoundingClientRect();
    path.style.transition = `stroke-dashoffset ${REDUCED ? 1 : DRAW_MS}ms cubic-bezier(.45,.1,.3,1)`;
    path.style.strokeDashoffset = 0;
    later(() => head.classList.add("show"), REDUCED ? 0 : DRAW_MS - 60);
  }

  // ---------- selection ----------
  let current = null, timers = [], idle = null, layer = null;
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  function clearWires() {
    if (!layer) return;
    const old = layer;
    old.classList.add("fading");
    setTimeout(() => old.remove(), 320);
    layer = null;
  }

  function select(id) {
    if (current === id) { reset(); return; }
    current = id;
    clearTimers();
    clearWires();
    armIdle();

    const { lit, edges, up, self } = trace(id);
    const group = id.startsWith("g:");
    // Influence: for sources, the share of the selection that comes from them;
    // for everything downstream, the share of it that comes from the selection.
    const targets = [...self], I = {};
    lit.forEach(n => {
      if (isRule(n)) return;
      I[n] = self.has(n) ? 1 : up.has(n) ? avg(targets.map(t => share(n, t))) : avg(targets.map(t => share(t, n)));
    });
    const flow = ([a, b]) => { const w = W8[a + ">" + b] || 0; return (self.has(b) || up.has(b)) ? w * I[b] : I[a] * w; };
    resetBtn.classList.add("show");
    DATA.items.forEach(it => { els[it.id].classList.remove("on", "picked", "soft"); els[it.id].style.removeProperty("--t"); });
    frames.forEach(f => frameEls[f.name].classList.toggle("picked", group && "g:" + f.name === id));
    if (!group) els[id].classList.add("picked");
    traceLayout(lit);
    render();
    if (!group) { els[id].style.setProperty("--t", 1); els[id].classList.add("on"); }

    layer = document.createElementNS(SVGNS, "g");
    wires.appendChild(layer);
    const mine = layer;

    // Reveal left to right: a column lights up, then the arrows into the next one.
    const step = REDUCED ? 0 : 950;
    let t = REDUCED ? 0 : 950;
    STAGES.forEach((st, i) => {
      const nodes = DATA.items.filter(it => lit.has(it.id) && !isRule(it.id) && stageOf(it) === st);
      if (!nodes.length) return;
      const incoming = edges.filter(([, b]) => stageOf(byId[b]) === st).sort((x, y) => flow(x) - flow(y));
      const at = t;
      later(() => { if (layer === mine) incoming.forEach(e => drawEdge(mine, e[0], e[1], e.hot || e[0] === id || e[1] === id, flow(e))); }, at);
      later(() => nodes.forEach(it => {
        const tv = Math.max(0.1, Math.min(1, Math.pow(I[it.id] / 0.6, 0.75)));
        els[it.id].style.setProperty("--t", tv.toFixed(3));
        els[it.id].classList.toggle("soft", tv < 0.55);
        els[it.id].classList.add("on");
      }), at + (incoming.length && !REDUCED ? DRAW_MS - 150 : 0));
      t += incoming.length || i === 0 ? step : step / 2;
    });
  }

  function reset() {
    current = null;
    clearTimers();
    clearWires();
    clearTimeout(idle);
    resetBtn.classList.remove("show");
    DATA.items.forEach(it => { els[it.id].classList.remove("on", "picked", "soft"); els[it.id].style.removeProperty("--t"); });
    frames.forEach(f => frameEls[f.name].classList.remove("picked"));
    restLayout();
    render();
  }

  function armIdle() { clearTimeout(idle); idle = setTimeout(reset, IDLE_MS); }
  // Any activity keeps a trace open; the timer only runs while nobody is using the page.
  let lastArm = 0;
  ["pointermove", "keydown", "wheel", "touchstart"].forEach(ev => addEventListener(ev, () => {
    if (current && Date.now() - lastArm > 1000) { lastArm = Date.now(); armIdle(); }
  }, { passive: true }));

  resetBtn.addEventListener("click", ev => { ev.stopPropagation(); reset(); hideTip(); });
  vp.addEventListener("click", () => { if (current) reset(); hideTip(); });
  addEventListener("keydown", ev => { if (ev.key === "Escape" && current) reset(); });

  // ---------- explainer ----------
  // After a click the cards move under a still cursor; ignore hover until the mouse really moves.
  let muted = false, muteAt = null, clickedRecently = false;
  function muteHover(ev) {
    muted = true; muteAt = ev && ev.clientX ? [ev.clientX, ev.clientY] : null; clickedRecently = true;
    setTimeout(() => { clickedRecently = false; }, 900);
  }
  addEventListener("pointermove", e => {
    if (!muted) return;
    if (!muteAt) { muteAt = [e.clientX, e.clientY]; return; }
    if (Math.hypot(e.clientX - muteAt[0], e.clientY - muteAt[1]) > 6) muted = false;
  }, { passive: true });
  function hoverTip(el, t) { if (!touching && !muted) showTip(el, t); }

  function tipFor(it) {
    const head = isRule(it.id) ? DATA.copy.col_rules : DATA.copy[HEADS[it.column]];
    return { over: isRule(it.id) ? `${head} · ${it.group}` : head, title: it.label, body: it.hover, lives: it.lives_in, sec: it.column,
      livesLabel: it.column === "outputs" ? DATA.copy.lives_output_label : DATA.copy.lives_source_label };
  }

  function showTip(el, t) {
    tip.className = "s-" + t.sec;
    tip.innerHTML = "";
    const add = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; tip.appendChild(n); return n; };
    if (t.over) add("div", "over", t.over);
    add("h3", null, t.title);
    if (t.body) add("p", null, t.body);
    if (t.list) { const ul = add("ul"); t.list.forEach(x => { const li = document.createElement("li"); li.textContent = x; ul.appendChild(li); }); }
    if (t.lives) { const l = add("div", "lives"); l.append(t.livesLabel + ": "); const b = document.createElement("b"); b.textContent = t.lives; l.appendChild(b); }
    const sheet = document.body.classList.contains("narrow") || touching;
    tip.classList.toggle("sheet", sheet);
    if (!sheet) {
      const r = el.getBoundingClientRect(), tw = t.list ? 360 : 300, pad = 14;
      tip.style.width = tw + "px";
      const th = tip.offsetHeight;
      let x = r.right + pad;
      if (x + tw > innerWidth - 8) x = r.left - pad - tw;
      if (x < 8) x = Math.min(innerWidth - tw - 8, Math.max(8, r.left));
      let y = r.top + r.height / 2 - th / 2;
      y = Math.max(8, Math.min(innerHeight - th - 8, y));
      tip.style.left = x + "px";
      tip.style.top = y + "px";
    } else { tip.style.width = ""; }
    tip.classList.add("show");
  }
  function hideTip() { tip.classList.remove("show"); }

  // ---------- fit to screen ----------
  function fit() {
    const vw = innerWidth, vh = innerHeight;
    const narrow = vw < 700;
    let s;
    if (narrow) s = Math.max(0.62, Math.min(0.9, vh / H));
    else {
      s = Math.min(vw / W, vh / H, 1.3);
      if (vh / H < vw / W && vh / H < 0.6) s = Math.min(vw / W, 1.3);   // short and wide: fit width, scroll down
    }
    const scrollY = !narrow && H * s > vh + 1;
    document.body.classList.toggle("narrow", narrow);
    document.body.classList.toggle("scrolly", scrollY);
    const sz = document.getElementById("sizer");
    sz.style.width = narrow ? W * s + "px" : "100%";
    sz.style.height = narrow || scrollY ? H * s + "px" : "100%";
    const ox = narrow ? 0 : Math.max(0, (vw - W * s) / 2), oy = narrow || scrollY ? 0 : (vh - H * s) / 2;
    stage.style.transform = `translate(${ox}px, ${oy}px) scale(${s})`;
    // Deselect sits on the grid: right edge of the last column, level with the title.
    if (narrow) { resetBtn.style.left = "auto"; resetBtn.style.right = "12px"; resetBtn.style.top = "12px"; }
    else {
      resetBtn.style.right = "auto";
      resetBtn.style.left = ox + RIGHT_EDGE * s - resetBtn.offsetWidth + "px";
      resetBtn.style.top = oy + 48 * s + (35 * s - resetBtn.offsetHeight) / 2 + "px";
    }
    updateFade();
    hideTip();
  }
  function updateFade() {
    fadeEl.classList.toggle("show", vp.scrollLeft + vp.clientWidth < vp.scrollWidth - 4);
  }
  addEventListener("resize", fit);
  vp.addEventListener("scroll", () => { hideTip(); updateFade(); }, { passive: true });

  restLayout();
  render();
  fit();
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("ready")));
})();
</script>
</body>
</html>
