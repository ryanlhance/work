<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>TIFF Practical Interview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css?v=8" />
  <link rel="stylesheet" href="../viewer.css?v=4" />
  <link rel="stylesheet" href="./workshop.css?v=8" />
</head>
<body>
  <div class="viewer-bar">
    <a class="bar-link" href="../">
      <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3.5M7.5 4l-4 4 4 4"/></svg>
      <span>All Builds</span>
    </a>
  </div>

  <main class="page">
    <header class="masthead">
      <h1>TIFF Practical Interview</h1>
      <p class="sub">The use case discovery, prompt engineering, and output development all happened within <strong>one hour</strong>.</p>
    </header>
    <div class="divider"></div>

    <section class="act">
      <div class="act-head"><h2>The Use Case</h2></div>
      <div class="use-case" id="use-case"></div>
    </section>

    <section class="act">
      <div class="act-head"><h2>Files Received</h2></div>
      <div class="files-row" id="files-row"></div>
      <div class="file-panel" id="file-panel" hidden></div>
    </section>

    <section class="act">
      <div class="act-head">
        <h2>Strategy</h2>
        <p class="act-sub">The decisions I made, and why.</p>
      </div>
      <ol class="strategy" id="strategy"></ol>
    </section>

    <section class="act" id="act-output">
      <div class="act-head"><h2>Outputs</h2></div>

      <h3 class="sub-head" id="email-label"></h3>
      <p class="sub-note" id="email-note"></p>
      <div class="pages" id="pages"></div>
      <p class="download"><a id="pdf-link" href="#" download>Download the draft email</a></p>

      <h3 class="sub-head" id="dash-label"></h3>
      <p class="sub-note" id="dash-note"></p>
      <div class="live" id="live-dashboard">
        <iframe id="dash-frame" title="Weekly Fund Review dashboard" src="dashboard/"></iframe>
      </div>

      <h3 class="sub-head" id="gates-label"></h3>
      <p class="sub-note" id="gates-note"></p>
      <div class="gates" id="gates"></div>

      <h3 class="sub-head" id="skill-label"></h3>
      <p class="sub-note" id="skill-note"></p>
      <div class="skill" id="skill"></div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lb-close" aria-label="Close">×</button>
    <img id="lb-img" alt="" />
  </div>

  <script src="./data.js?v=7"></script>
  <script src="./workshop.js?v=7"></script>
</body>
</html>
